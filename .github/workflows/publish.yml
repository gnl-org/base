name: Publish Design System to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: design-system

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Trusted publishing (OIDC): Node >= 22.14, npm >= 11.5.1; id-token: write above.
      # Bundled npm on the runner is often too old and reports misleading ENEEDAUTH / E404;
      # upgrade explicitly (see https://github.com/npm/cli/issues/9088).
      # https://docs.npmjs.com/trusted-publishers
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.6.2 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

