name: Publish Design System to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: design-system

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Trusted publishing (OIDC) requires Node >= 22.14 and npm >= 11.5.1
      # https://docs.npmjs.com/trusted-publishers
      # Do not set registry-url + NODE_AUTH_TOKEN here: that forces token auth and
      # overrides OIDC. A bad/legacy token often surfaces as E404 on publish.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: unset NODE_AUTH_TOKEN && npm publish --access public

