name: Publish Design System to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: design-system

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Trusted publishing (OIDC): Node >= 22.14, npm >= 11.5.1; id-token: write above.
      # npm docs require registry-url here. Publish must NOT use NODE_AUTH_TOKEN (OIDC only);
      # a repo/org secret often overrides OIDC and can cause E404.
      # https://docs.npmjs.com/trusted-publishers
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ""

